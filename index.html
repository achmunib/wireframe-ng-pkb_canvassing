<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MPM AHASS - PKB Canvasing Portal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>

<body>
  <div class="app-layout" id="appLayout">
    <!-- Root Sidebar Navigation -->
    <aside class="sidebar" id="sidebar">
      <!-- Sidebar Brand -->
      <div class="sidebar-brand">
        <div class="brand-logo" id="brandToggle" title="Toggle Sidebar">
          <span class="brand-badge">MPM</span>
        </div>
        <div class="brand-info">
          <span class="brand-title">MPM AHASS</span>
          <span class="brand-sub">Canvasing Portal</span>
        </div>
      </div>

      <!-- Sidebar Navigation Items -->
      <nav class="sidebar-nav">
        <!-- Dashboard -->
        <div class="nav-group">
          <button class="nav-item" title="Dashboard">
            <span class="nav-icon">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="3" width="7" height="7" />
                <rect x="14" y="3" width="7" height="7" />
                <rect x="14" y="14" width="7" height="7" />
                <rect x="3" y="14" width="7" height="7" />
              </svg>
            </span>
            <span class="nav-text">Dashboard</span>
          </button>
        </div>

        <!-- Reception (Active Parent with Submenu) -->
        <div class="nav-group has-submenu open active-parent" id="groupReception">
          <button class="nav-item nav-parent" id="btnReception" title="Reception">
            <span class="nav-icon">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round">
                <!-- Reception Desk / User Check SVG -->
                <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2" />
                <circle cx="9" cy="7" r="4" />
                <polyline points="16 11 18 13 22 9" />
              </svg>
            </span>
            <span class="nav-text">Reception</span>
            <span class="nav-arrow">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round">
                <polyline points="6 9 12 15 18 9" />
              </svg>
            </span>
          </button>

          <!-- Accordion Submenu (Visible when expanded) -->
          <div class="submenu-container" id="submenuReception">
            <button class="submenu-item" id="navMasterCanvasing" data-module="master"
              data-src="Master Canvasing/index.html" data-crumb="Master Canvasing" title="Master Canvasing">
              <span class="submenu-dot"></span>
              <span class="submenu-icon">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                  stroke-linecap="round" stroke-linejoin="round">
                  <path d="M4 6h16M4 12h16M4 18h16" />
                </svg>
              </span>
              <span class="submenu-text">Master Canvasing</span>
            </button>

            <button class="submenu-item active" id="navListCanvasing" data-module="list"
              data-src="List Canvasing/index.html" data-crumb="List Canvasing" title="List Canvasing">
              <span class="submenu-dot"></span>
              <span class="submenu-icon">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                  stroke-linecap="round" stroke-linejoin="round">
                  <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" />
                  <polyline points="14 2 14 8 20 8" />
                  <line x1="16" y1="13" x2="8" y2="13" />
                  <line x1="16" y1="17" x2="8" y2="17" />
                  <polyline points="10 9 9 9 8 9" />
                </svg>
              </span>
              <span class="submenu-text">List Canvasing</span>
              <span class="submenu-badge">PKB</span>
            </button>
          </div>

          <!-- Flyout Submenu Card (Visible when sidebar is collapsed) -->
          <div class="flyout-card" id="flyoutReception">
            <div class="flyout-header">Reception</div>
            <div class="flyout-links">
              <button class="flyout-item" id="flyoutMasterCanvasing" data-module="master"
                data-src="Master Canvasing/index.html" data-crumb="Master Canvasing">
                <span class="flyout-dot"></span>
                <span>Master Canvasing</span>
              </button>
              <button class="flyout-item active" id="flyoutListCanvasing" data-module="list"
                data-src="List Canvasing/index.html" data-crumb="List Canvasing">
                <span class="flyout-dot"></span>
                <span>List Canvasing (PKB)</span>
              </button>
            </div>
          </div>
        </div>

        <!-- Garage / Vehicle -->
        <div class="nav-group">
          <button class="nav-item" title="Garage / Vehicle">
            <span class="nav-icon">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round">
                <path
                  d="M19 17h2c.6 0 1-.4 1-1v-3c0-.9-.7-1.7-1.5-1.9C18.7 10.6 16 10 16 10s-1.3-1.4-2.2-2.3c-.5-.4-1.1-.7-1.8-.7H5c-.6 0-1.1.4-1.4.9l-1.5 2.8C2.1 11 2 11.5 2 12v4c0 .6.4 1 1 1h2" />
                <circle cx="7" cy="17" r="2" />
                <circle cx="17" cy="17" r="2" />
              </svg>
            </span>
            <span class="nav-text">Garage / Kendaraan</span>
          </button>
        </div>

        <!-- Forms -->
        <div class="nav-group">
          <button class="nav-item" title="Forms">
            <span class="nav-icon">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="3" width="18" height="18" rx="2" />
                <line x1="3" y1="9" x2="21" y2="9" />
                <line x1="9" y1="21" x2="9" y2="9" />
              </svg>
            </span>
            <span class="nav-text">Formulir Service</span>
          </button>
        </div>

        <!-- Task List -->
        <div class="nav-group">
          <button class="nav-item" title="Task List">
            <span class="nav-icon">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round">
                <polyline points="9 11 12 14 22 4" />
                <path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11" />
              </svg>
            </span>
            <span class="nav-text">Task List Mekanik</span>
          </button>
        </div>

        <!-- Spare Parts -->
        <div class="nav-group">
          <button class="nav-item" title="Spare Parts">
            <span class="nav-icon">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="3" />
                <path
                  d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z" />
              </svg>
            </span>
            <span class="nav-text">Spare Parts &amp; Oli</span>
          </button>
        </div>

        <!-- Documents -->
        <div class="nav-group">
          <button class="nav-item" title="Documents">
            <span class="nav-icon">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round">
                <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" />
                <polyline points="14 2 14 8 20 8" />
                <line x1="16" y1="13" x2="8" y2="13" />
                <line x1="16" y1="17" x2="8" y2="17" />
                <polyline points="10 9 9 9 8 9" />
              </svg>
            </span>
            <span class="nav-text">Dokumen PKB</span>
          </button>
        </div>

        <!-- History / Warranty -->
        <div class="nav-group">
          <button class="nav-item" title="History / Warranty">
            <span class="nav-icon">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z" />
              </svg>
            </span>
            <span class="nav-text">Riwayat &amp; Garansi</span>
          </button>
        </div>

        <!-- Settings -->
        <div class="nav-group">
          <button class="nav-item" title="Settings">
            <span class="nav-icon">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="10" />
                <path d="M12 16v-4" />
                <path d="M12 8h.01" />
              </svg>
            </span>
            <span class="nav-text">Pengaturan</span>
          </button>
        </div>
      </nav>

      <!-- Sidebar Footer -->
      <div class="sidebar-footer">
        <button class="nav-item" id="btnHelp" title="Bantuan &amp; Panduan">
          <span class="nav-icon">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
              stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="10" />
              <path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3" />
              <line x1="12" y1="17" x2="12.01" y2="17" />
            </svg>
          </span>
          <span class="nav-text">Bantuan</span>
        </button>

        <button class="nav-item" id="btnSidebarCollapse" title="Collapse / Expand Sidebar">
          <span class="nav-icon toggle-arrow">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
              stroke-linecap="round" stroke-linejoin="round">
              <polyline points="15 18 9 12 15 6" />
            </svg>
          </span>
          <span class="nav-text">Ciutkan Sidebar</span>
        </button>
      </div>
    </aside>

    <!-- Main Container -->
    <div class="main-wrapper">
      <!-- Top Header Navigation -->
      <header class="top-header">
        <div class="header-left">
          <button class="menu-toggle" id="sidebarToggle" aria-label="Toggle Sidebar" title="Buka/Tutup Menu">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
              stroke-linecap="round" stroke-linejoin="round">
              <line x1="3" y1="12" x2="21" y2="12"></line>
              <line x1="3" y1="6" x2="21" y2="6"></line>
              <line x1="3" y1="18" x2="21" y2="18"></line>
            </svg>
          </button>

          <div class="breadcrumbs">
            <span class="crumb-parent">Reception</span>
            <span class="crumb-separator">/</span>
            <span class="crumb-active" id="crumbActive">List Canvasing</span>
          </div>
        </div>

        <div class="header-right">
          <!-- Module Switch Quick Selector -->
          <div class="quick-module-tabs">
            <button class="quick-tab" id="tabMasterCanvasing" data-module="master">
              <span>Master Canvasing</span>
            </button>
            <button class="quick-tab active" id="tabListCanvasing" data-module="list">
              <span>List Canvasing (PKB)</span>
            </button>
          </div>

          <!-- Language Switcher -->
          <div class="lang-switch">
            <button class="lang-btn" id="langId">ID</button>
            <button class="lang-btn active" id="langEn">EN</button>
          </div>

          <!-- User Profile Menu -->
          <div class="user-profile" id="userMenuBtn">
            <div class="user-avatar">PK</div>
            <div class="user-info">
              <span class="user-name">Pak Kabeng</span>
              <span class="user-role">150 - Chiro</span>
            </div>
            <svg class="chevron-down" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
              stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="6 9 12 15 18 9"></polyline>
            </svg>
          </div>
        </div>
      </header>

      <!-- Frame Viewport for Active Module -->
      <main class="frame-container">
        <iframe id="moduleFrame" src="List Canvasing/index.html" title="PKB Canvasing Module Frame"
          loading="eager"></iframe>
      </main>
    </div>
  </div>

  <!-- Toast Notification -->
  <div class="toast-container" id="toastContainer"></div>

  <script src="app.js"></script>
</body>

</html>
